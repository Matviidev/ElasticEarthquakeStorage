services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -s http://localhost:9200/_cluster/health | grep ''"status":"green"'' || exit 1',
        ]
      interval: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  ks-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ks-app
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_NODE=http://elasticsearch:9200
    volumes:
      - ./server:/usr/src/app
      - ./init-es.sh:/usr/src/app/init-es.sh
    working_dir: /usr/src/app
    command: sh ./init-es.sh && npm run dev
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  esdata:
